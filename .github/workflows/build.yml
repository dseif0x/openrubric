name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # Build the app target directly. CI has no signing identity (and doesn't
      # need one just to verify the app compiles), so code signing is disabled.
      # We build the target rather than a scheme because the scheme lives in
      # gitignored xcuserdata and isn't shared.
      - name: Build
        run: >
          xcodebuild
          -project OpenRubric.xcodeproj
          -target OpenRubric
          -configuration Release
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=""
          build
