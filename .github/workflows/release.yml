name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, package & release (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # CI has no signing identity, so this is an UNSIGNED build. Users must bypass
      # Gatekeeper (see the generated release notes) until signing + notarization
      # secrets are wired up.
      - name: Build (unsigned, Release)
        run: >
          xcodebuild
          -project OpenRubric.xcodeproj
          -target OpenRubric
          -configuration Release
          CONFIGURATION_BUILD_DIR="$PWD/build"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/OpenRubric.app"
          test -d "$APP" || { echo "::error::App not found at $APP"; exit 1; }
          STAGING="$(mktemp -d)/OpenRubric"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "OpenRubric" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "OpenRubric-${GITHUB_REF_NAME}.dmg"

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          ## OpenRubric ${{ github.ref_name }}

          Download \`OpenRubric-${{ github.ref_name }}.dmg\` below, open it, and drag **OpenRubric** to your Applications folder.

          > **Note:** this build is not signed or notarized, so macOS will warn it is from an
          > unidentified developer. Right-click the app → **Open**, or run:
          > \`\`\`
          > xattr -dr com.apple.quarantine /Applications/OpenRubric.app
          > \`\`\`
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true
          files: OpenRubric-*.dmg
